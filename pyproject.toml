[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-bench"
version = "0.1.0"
description = "Analytic simulator and debug renderer for the video-model physics benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
render = [
  "Pillow>=11.0",
  "imageio-ffmpeg>=0.6",
]

[project.scripts]
physics-bench = "physics_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
